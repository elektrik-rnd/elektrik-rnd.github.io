<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Voltage Montage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="https://upload.wikimedia.org/wikipedia/commons/f/f1/Bitcoin_lightning_logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://upload.wikimedia.org/wikipedia/commons/f/f1/Bitcoin_lightning_logo.png">
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="https://upload.wikimedia.org/wikipedia/commons/f/f1/Bitcoin_lightning_logo.png">
</head>

<style>
    body {
        margin: 0;
        background-color: #130e0e;
        color: #f2f2f2;
        font-family: Arial, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
    }

    .card {
        width: 95%;
        max-width: 400px;
        background-color: #050505;
        border-radius: 10px;
        padding: 25px;
        box-sizing: border-box;
        text-align: center;
    }

    /* Заголовок с бликом туда-обратно */
    .title-glow {
        position: relative;
        display: inline-block;
        margin: 0 0 15px 0;
        color: #f2f2f2;
        font-size: 24px;
        overflow: hidden;
    }

    .title-glow::before {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(
            120deg,
            transparent 0%,
            rgba(242,242,242,0.0) 20%,
            rgba(242,242,242,0.9) 50%,
            rgba(242,242,242,0.0) 80%,
            transparent 100%
        );
        transform: skewX(-20deg);
        opacity: 0;
        animation: titleShineBackForth 14s ease-in-out infinite;
        z-index: 2;
    }

    @keyframes titleShineBackForth {
        0%, 5% { left: -40%; opacity: 0; }
        15% { opacity: 0.9; }
        35% { left: 120%; opacity: 0; }
        45% { left: 120%; opacity: 0; }
        55% { opacity: 0.9; }
        75% { left: -40%; opacity: 0; }
        100% { left: -40%; opacity: 0; }
    }

    /* Кнопка с ярким свечением */
    .call-button {
        display: block;
        background: #f2f2f2;
        color: #120d0d;
        padding: 18px;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        margin: 25px auto;
        font-size: 20px;
        width: 80%;
        max-width: 260px;
        box-sizing: border-box;
        touch-action: manipulation;
        animation: buttonGlow 6s ease-in-out infinite;
        position: relative;
        transition: box-shadow 1.1s ease-out;  /* 1.1 секунды плавного свечения */
    }

    @keyframes buttonGlow {
        0%, 100% { box-shadow: 0 0 12px rgba(242,242,242,0.2); }
        25% { box-shadow: 0 0 25px rgba(242,242,242,0.45); }
        50% { box-shadow: 0 0 40px rgba(242,242,242,0.65); }
        75% { box-shadow: 0 0 25px rgba(242,242,242,0.45); }
    }

    .call-button:hover {
        animation-play-state: paused;
        box-shadow: 0 0 45px rgba(242,242,242,0.75) !important;
    }

    /* Соцсети */
    .social-icons {
        margin: 20px 0 30px 0;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        width: 100%;
        gap: 0;
    }

    .social-icons a {
        display: inline-block;
        flex: 1;
        text-align: center;
    }

    .social-icons img {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        transition: transform 0.5s ease, box-shadow 0.5s ease;
    }

    .social-icons img:hover {
        transform: scale(1.05);
        box-shadow: 0 0 16px rgba(242,242,242,0.35);
    }
</style>

<body>
    <div class="card">
        <!-- Логотип 193×193px -->
        <img src="logo.jpg" width="193" height="193" alt="Voltage Montage" style="margin-bottom:10px; border-radius:10px;">

        <!-- Название с бликом -->
        <h2 class="title-glow">VOLTAGE MONTAGE</h2>

        <!-- Описание -->
        <p style="margin:8px 0; color:#f2f2f2; font-size:16px;">Электромонтажные работы</p>
        <p style="margin:8px 0; color:#f2f2f2; font-size:16px;">Электрика • Видеонаблюдение • Интернет</p>
        <p style="margin:8px 0 25px 0; color:#f2f2f2; font-size:16px;">Умный дом • Безопасно • Качественно</p>

        <!-- Кнопка с 1.1с плавным свечением -->
        <a href="tel:+79185756519" class="call-button">
            📱 ПОЗВОНИТЬ 📱
        </a>

        <!-- Надпись над иконками -->
        <div style="margin:25px 0 20px 0; color:#f2f2f2; font-size:16px;">
            Связаться удобным способом
        </div>

        <!-- Соцсети -->
        <div class="social-icons">
            <a href="https://t.me/+79185756519" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Telegram_2019_Logo.svg" alt="Telegram">
            </a>
            <a href="https://wa.me/79185756519" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            </a>
            <a href="https://instagram.com/elektrik_uga/" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
            </a>
            <a href="https://max.ru/u/f9LHodD0cOKBmmqkeevlRKfWIjRVnGlaGE-NTN6EaLI" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/%D0%9B%D0%BE%D0%B3%D0%BE%D1%82%D0%B8%D0%BF_MAX.svg" alt="Max">
            </a>
        </div>

        <!-- Счётчик -->
        <div class="counter-container">
            <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Felektrik-rnd.github.io%2F&label=&icon=lightning-fill&color=%23d2f4ea&message=&style=plastic&tz=Europe%2FMoscow"
                 alt="Счётчик посещений">
        </div>
    </div>
</body>
</html>
