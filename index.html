<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Voltage Montage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/jpeg" sizes="32x32" href="logo.jpg">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="logo.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.jpg">
</head>

<style>
    body {
        margin: 0;
        background-color: #050505;
        color: #f2f2f2;
        font-family: Arial, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
    }

    .card {
        width: 95%;
        max-width: 400px;
        background-color: #050505;
        border-radius: 10px;
        padding: 10px 25px 25px 25px;
        box-sizing: border-box;
        text-align: center;
    }

    .logo-img {
        width: 232px;
        height: 232px;
        border-radius: 10px;
        object-fit: cover;
        object-position: center;
        margin: 0 auto 2.5px auto;
        display: block;
        clip-path: inset(15% round 10px);
    }

    .title-glow {
        position: relative;
        display: inline-block;
        margin: 0 0 15px 0;
        color: #f2f2f2;
        font-size: 24px;
        overflow: hidden;
    }

    .title-glow::before {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(
            120deg,
            transparent 0%,
            rgba(254, 187, 10, 0.0) 20%,
            rgba(254, 187, 10, 0.95) 50%,
            rgba(254, 187, 10, 0.7) 65%,
            rgba(254, 187, 10, 0.3) 80%,
            transparent 100%
        );
        transform: skewX(-20deg);
        opacity: 0;
        animation: titleShineBackForth 7s ease-in-out infinite;
        z-index: 2;
    }

    @keyframes titleShineBackForth {
        0%, 5% { left: -40%; opacity: 0; }
        15% { opacity: 0.9; }
        35% { left: 120%; opacity: 0; }
        45% { left: 120%; opacity: 0; }
        55% { opacity: 0.9; }
        75% { left: -40%; opacity: 0; }
        100% { left: -40%; opacity: 0; }
    }

    .call-button {
        display: block;
        background: #f2f2f2;
        color: #120d0d;
        padding: 18px;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        margin: 25px auto;
        font-size: 20px;
        width: 80%;
        max-width: 260px;
        box-sizing: border-box;
        touch-action: manipulation;
        animation: buttonGlow 6s ease-in-out infinite;
        position: relative;
        transition: box-shadow 1.1s ease-out;
    }

    @keyframes buttonGlow {
        0%, 100% { box-shadow: 0 0 12px rgba(254, 187, 10, 0.25); }
        25% { box-shadow: 0 0 25px rgba(254, 187, 10, 0.45); }
        50% { box-shadow: 0 0 40px rgba(254, 187, 10, 0.7); }
        75% { box-shadow: 0 0 25px rgba(254, 187, 10, 0.45); }
    }

    .call-button:hover {
        animation-play-state: paused;
        box-shadow: 0 0 50px rgba(254, 187, 10, 0.85) !important;
    }

    .social-icons {
        margin: 20px 0 30px 0;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        width: 100%;
        gap: 0;
    }

    .social-icons a {
        display: inline-block;
        flex: 1;
        text-align: center;
    }

    .social-icons img {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        transition: transform 0.5s ease, box-shadow 0.5s ease;
    }

    .social-icons img:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(254, 187, 10, 0.6);
    }
</style>

<body>
    <div class="card">
        <img src="logo.jpg" alt="Voltage Montage" class="logo-img">
        <h2 class="title-glow">VOLTAGE MONTAGE</h2>
        <p style="margin:8px 0; color:#f2f2f2; font-size:16px;">
            Электромонтажные работы любой сложности • Видеонаблюдение • Интернет
        </p>
        <p style="margin:8px 0 25px 0; color:#f2f2f2; font-size:16px;">
            Умный дом • Безопасно • Качественно
        </p>
        <a href="tel:+79185756519" class="call-button">
            📱 ПОЗВОНИТЬ 📱
        </a>
        <div style="margin:25px 0 20px 0; color:#f2f2f2; font-size:16px;">
            Связаться удобным способом
        </div>
        <div class="social-icons">
            <a href="https://t.me/+79185756519" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Telegram_2019_Logo.svg" alt="Telegram">
            </a>
            <a href="https://wa.me/79185756519" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
            </a>
            <a href="https://instagram.com/elektrik_uga/" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
            </a>
            <a href="https://max.ru/u/f9LHodD0cOKBmmqkeevlRKfWIjRVnGlaGE-NTN6EaLI" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/%D0%9B%D0%BE%D0%B3%D0%BE%D1%82%D0%B8%D0%BF_MAX.svg" alt="Max">
            </a>
        </div>
        <div class="counter-container">
            <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Felektrik-rnd.github.io%2F&label=&icon=lightning-fill&color=%23d2f4ea&message=&style=plastic&tz=Europe%2FMoscow"
                 alt="Счётчик посещений">
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            document.title = 'VOLTAGE ↯ MONTAGE';
        });
    </script>
</body>
</html>
