<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Voltage Montage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" sizes="32x32" href="logo.jpg">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="logo.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.jpg">
</head>

<style>
    body {
        margin: 0;
        background-color: #000000;
        color: #f2f2f2;
        font-family: 'Inter', Arial, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: flex-start;
        justify-content: center;
        padding-top: 20px;
    }

    .card {
        width: 95%;
        max-width: 400px;
        background-color: #000000;
        border-radius: 10px;
        padding: 5px 25px 25px 25px;
        box-sizing: border-box;
        text-align: center;
    }

    .logo-img {
        width: 232px;
        height: 232px;
        border-radius: 10px;
        object-fit: cover;
        object-position: center;
        margin: 0 auto 10px auto;
        display: block;
    }

    .title-glow {
        position: relative;
        display: inline-block;
        margin: 0 0 15px 0;
        color: #f2f2f2;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 1px;
        overflow: hidden;
    }

    .title-glow::before {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(
            120deg,
            transparent 0%,
            rgba(254, 187, 10, 0.0) 20%,
            rgba(254, 187, 10, 0.95) 50%,
            rgba(254, 187, 10, 0.7) 65%,
            rgba(254, 187, 10, 0.3) 80%,
            transparent 100%
        );
        transform: skewX(-20deg);
        opacity: 0;
        animation: titleShineBackForth 7s ease-in-out infinite;
        z-index: 2;
    }

    @keyframes titleShineBackForth {
        0%, 5% { left: -40%; opacity: 0; }
        15% { opacity: 0.9; }
        35% { left: 120%; opacity: 0; }
        45% { left: 120%; opacity: 0; }
        55% { opacity: 0.9; }
        75% { left: -40%; opacity: 0; }
        100% { left: -40%; opacity: 0; }
    }

    @keyframes unifiedGlow {
        0%, 100% { box-shadow: 0 0 12px rgba(254, 187, 10, 0.25); }
        25% { box-shadow: 0 0 25px rgba(254, 187, 10, 0.45); }
        50% { box-shadow: 0 0 40px rgba(254, 187, 10, 0.7); }
        75% { box-shadow: 0 0 25px rgba(254, 187, 10, 0.45); }
    }

    .glow-element {
        animation: unifiedGlow 6s ease-in-out infinite;
        transition: box-shadow 0.3s ease-out;
    }

    .call-button {
        display: block;
        background: #f2f2f2;
        color: #120d0d;
        padding: 18px;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        margin: 10px auto 30px auto;
        font-size: 20px;
        width: 80%;
        max-width: 260px;
        box-sizing: border-box;
        touch-action: manipulation;
    }

    .call-button:hover {
        animation-play-state: paused;
        box-shadow: 0 0 50px rgba(254, 187, 10, 0.85) !important;
    }

    .services-text {
        color: #f2f2f2;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.4;
        margin: 0 0 25px 0;
        text-align: center;
    }

    .services-line1 {
        display: block;
        margin: 0 auto 4px auto;
        white-space: nowrap;
        width: 100%;
    }

    .services-line2 {
        display: block;
        margin: 0 auto 12px auto;
        white-space: nowrap;
        width: 100%;
    }

    .services-line3 {
        display: block;
        margin: 8px auto 0 auto;
        white-space: nowrap;
        width: fit-content;
        text-align: center;
    }

    .social-label {
        color: #f2f2f2;
        font-size: 15px;
        font-weight: 400;
        margin: 0 0 20px 0;
    }

    .social-icons {
        margin: 0 0 20px 0;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        width: 100%;
    }

    .social-icons a {
        flex: 1;
        text-align: center;
    }

    .social-icons img {
        border-radius: 8px;
        max-width: 48px;
        max-height: 48px;
        width: auto;
        height: auto;
    }

    .social-icons img.glow-element {
        animation: unifiedGlow 6s ease-in-out infinite;
        transition: box-shadow 0.3s ease-out;
    }

    .social-icons img:hover {
        animation-play-state: paused;
        box-shadow: 0 0 50px rgba(254, 187, 10, 0.85) !important;
    }

    .counter-container {
        opacity: 0.7;
    }
</style>

<body>
    <div class="card">
        <img src="logo.jpg" alt="Voltage Montage" class="logo-img">
        <h2 class="title-glow">VOLTAGE MONTAGE</h2>
        
        <a href="tel:+79185756519" class="call-button glow-element">
            📱 ПОЗВОНИТЬ 📱
        </a>
        
        <div class="services-text">
            <span class="services-line1">электромонтажные работы любой сложности</span>
            <span class="services-line2">• видеонаблюдение • интернет • умный дом •</span>
            <span class="services-line3">безопасно • качественно</span>
        </div>

        <div class="social-label">мы в соцсетях</div>
        
        <div class="social-icons">
            <a href="https://t.me/+79185756519" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Telegram_2019_Logo.svg" alt="Telegram" class="glow-element">
            </a>
            <a href="https://wa.me/79185756519" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" class="glow-element">
            </a>
            <a href="https://www.instagram.com/voltage_montage/" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram" class="glow-element">
            </a>
            <a href="https://max.ru/u/f9LHodD0cOKImc87MNoK51SD6Rqs9gYnwjY3hH_VQAhuzYD4iimbLTRZu1c" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/%D0%9B%D0%BE%D0%B3%D0%BE%D1%82%D0%B8%D0%BF_MAX.svg" alt="Max" class="glow-element">
            </a>
        </div>
        
        <div class="counter-container">
            <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Felektrik-rnd.github.io%2F&label=&icon=lightning-fill&color=%23d2f4ea&message=&style=plastic&tz=Europe%2FMoscow"
                 alt="Счётчик посещений">
        </div>
    </div>

    <script>
        document.title = 'VOLTAGE ↯ MONTAGE';
    </script>
</body>
</html>
