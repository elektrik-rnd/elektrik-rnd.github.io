<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Voltage Montage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="https://upload.wikimedia.org/wikipedia/commons/f/f1/Bitcoin_lightning_logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://upload.wikimedia.org/wikipedia/commons/f/f1/Bitcoin_lightning_logo.png">
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="https://upload.wikimedia.org/wikipedia/commons/f/f1/Bitcoin_lightning_logo.png">

    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #f2f2f2;
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 95%;
            max-width: 400px;
            background-color: #111111;
            border-radius: 10px;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Заголовок с бликом и искрами */
        .title-glow {
            position: relative;
            display: inline-block;
            margin: 0 0 15px 0;
            color: #f2f2f2;
            font-size: 24px;
            overflow: hidden;
        }

        .title-glow::before {
            content: "";
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(
                120deg,
                transparent 0%,
                rgba(242,242,242,0.0) 20%,
                rgba(242,242,242,0.8) 50%,
                rgba(242,242,242,0.0) 80%,
                transparent 100%
            );
            transform: skewX(-20deg);
            opacity: 0;
            animation: titleShine 7s ease-in-out infinite;
            z-index: 2;
        }

        /* Контейнер для искр */
        .sparks-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Искры */
        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #f2f2f2 0%, rgba(242,242,242,0.3) 70%, transparent 100%);
            border-radius: 50%;
            opacity: 0;
            animation: sparkFly 0.8s ease-out forwards;
        }

        @keyframes titleShine {
            0% { left: -40%; opacity: 0; }
            15% { opacity: 0.9; }
            50% { left: 120%; opacity: 0; }
            100% { left: 120%; opacity: 0; }
        }

        @keyframes sparkFly {
            0% { opacity: 1; transform: translateY(0) scale(0); }
            50% { opacity: 0.8; transform: translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-40px) scale(0.5); }
        }

        /* Кнопка с ярким свечением (+30% площадь) */
        .call-button {
            display: block;
            background: #f2f2f2;
            color: #120d0d;
            padding: 18px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin: 25px auto;
            font-size: 20px;
            width: 80%;
            max-width: 260px;
            box-sizing: border-box;
            touch-action: manipulation;
            animation: buttonGlow 6s ease-in-out infinite;
            position: relative;
        }

        /* Яркое циклическое свечение (40px в пике) */
        @keyframes buttonGlow {
            0%, 100% {
                box-shadow: 0 0 12px rgba(242,242,242,0.2);
            }
            25% {
                box-shadow: 0 0 25px rgba(242,242,242,0.45);
            }
            50% {
                box-shadow: 0 0 40px rgba(242,242,242,0.65); /* +30% ярче и шире */
            }
            75% {
                box-shadow: 0 0 25px rgba(242,242,242,0.45);
            }
        }

        /* Hover эффект */
        .call-button:hover {
            animation-play-state: paused;
            box-shadow: 0 0 45px rgba(242,242,242,0.75) !important;
        }

        /* Соцсети — исправлено для iOS */
        .social-icons {
            margin: 20px 0 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .social-icons a {
            display: inline-block;
            flex: 0 0 auto;
        }

        .social-icons img {
            border-radius: 5px;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .social-icons img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 16px rgba(242,242,242,0.35);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Логотип (увеличен на 20%) -->
        <img src="logo.jpg" width="115" height="115" alt="Voltage Montage" style="margin-bottom:20px; border-radius:10px;">

        <!-- Название с бликом и искрами -->
        <h2 class="title-glow">
            <div class="sparks-container" id="sparks"></div>
            VOLTAGE MONTAGE
        </h2>

        <!-- Описание -->
        <p style="margin:8px 0; color:#f2f2f2; font-size:16px;">Электромонтажные работы</p>
        <p style="margin:8px 0; color:#f2f2f2; font-size:16px;">Электрика • Видеонаблюдение • Интернет</p>
        <p style="margin:8px 0 25px 0; color:#f2f2f2; font-size:16px;">Умный дом • Безопасно • Качественно</p>

        <!-- Кнопка с ярким свечением -->
        <a href="tel:+79185756519" class="call-button">
            📱 ПОЗВОНИТЬ 📱
        </a>

        <!-- Надпись над иконками -->
        <div style="margin:25px 0 20px 0; color:#f2f2f2; font-size:16px;">
            Связаться удобным способом
        </div>

        <!-- Иконки соцсетей (исправлено для iOS) -->
        <div class="social-icons">
            <a href="https://t.me/+79185756519" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Telegram_2019_Logo.svg" width="40" height="40" alt="Telegram">
            </a>
            <a href="https://wa.me/79185756519" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="40" height="40" alt="WhatsApp">
            </a>
            <a href="https://instagram.com/elektrik_uga/" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" width="40" height="40" alt="Instagram">
            </a>
            <a href="https://max.ru/u/f9LHodD0cOKBmmqkeevlRKfWIjRVnGlaGE-NTN6EaLI" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/%D0%9B%D0%BE%D0%B3%D0%BE%D1%82%D0%B8%D0%BF_MAX.svg" width="40" height="40" alt="Max">
            </a>
        </div>

        <!-- Счётчик посещений -->
        <div class="counter-container">
            <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Felektrik-rnd.github.io%2F&label=&icon=lightning-fill&color=%23d2f4ea&message=&style=plastic&tz=Europe%2FMoscow"
                 alt="Счётчик посещений">
        </div>
    </div>

    <script>
        // Искры для заголовка
        const sparksContainer = document.getElementById('sparks');
        
        function createSpark(x, delay = 0) {
            const spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = x + 'px';
            spark.style.animationDelay = delay + 's';
            sparksContainer.appendChild(spark);
            
            setTimeout(() => {
                spark.remove();
            }, 1000);
        }

        setInterval(() => {
            createSpark(50, 0.4);
            createSpark(120, 0.8);
            createSpark(200, 1.2);
        }, 7000);
    </script>
</body>
</html>
